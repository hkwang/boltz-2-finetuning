[project]
name = "boltz2-finetuning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boltz[cuda]==2.2.1",
    "openpyxl>=3.1.5",
    "torch==2.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
