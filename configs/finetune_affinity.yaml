# Boltz-2 affinity-head fine-tuning on cached trunk features. Consumed by experiments/train_affinity.py.
name: affinity_base
seed: 0
output_dir: experiments/results/finetune_affinity

checkpoint: ~/.cache/boltz/boltz2_aff.ckpt
labels_csv: data/processed/mac1_affinity/labels.csv
cache_dir: /eagle/GenesisHackathonOct26/hkwang/boltz2-finetuning/affinity_cache
eval_entries_csv: data/processed/mac1_eval/eval_entries.csv
eval_cache_dir: /eagle/GenesisHackathonOct26/hkwang/boltz2-finetuning/affinity_cache_eval

# Per optimizer step and GPU: IC50 rows from one assay (so pairwise terms exist) plus binder and non-binder screen rows.
batch:
  n_ic50: 8
  n_hit: 2
  n_nonhit: 6
  num_workers: 4

# Huber delta in log10 uM; focal alpha weights binders. Defaults follow molecularinformatics/Boltz2_affinity
# (absolute 0.5, pairwise 2.0, binary 1.0, alpha 0.25, gamma 2.0).
loss:
  huber_delta: 1.0
  absolute_weight: 0.5
  pairwise_weight: 2.0
  binary_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0

optimizer:
  max_lr: 2.0e-5
  warmup_steps: 50
  weight_decay: 0.001

trainer:
  devices: 4
  max_steps: 600
  gradient_clip_val: 10.0
  eval_every_n_steps: 100
